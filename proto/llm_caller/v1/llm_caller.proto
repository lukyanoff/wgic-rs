syntax = "proto3";

package llm_caller.v1;

// Mirrors the hand-written prost structs in crates/contracts/src/lib.rs (the Rust source of truth).
// Used only for the web playground's descriptors. Keep both in sync.

service LlmCallerService {
  rpc Call(CallRequest) returns (CallResponse) {}
}

message ImageInput {
  bytes data = 1;
  string mime_type = 2;
}

message CallRequest {
  string system_prompt = 1;
  string text_prompt = 2;
  string user_prompt = 3;
  repeated ImageInput images = 4;
}

message CallResponse {
  string text = 1;
  string model = 2;
}
