syntax = "proto3";

package llm_caller.v1;

// One chat message, like the OpenAI / Anthropic "messages" array.
message ChatMessage {
  // system | user | assistant
  string role = 1;
  string content = 2;
  // Pictures for the model to look at (user messages only), e.g. a screenshot.
  repeated Image images = 3;
}

// One picture, e.g. image/png or image/jpeg.
message Image {
  bytes data = 1;
  string mime_type = 2;
}

// Driver, model and effort come from the service configuration (one instance = one model setup),
// so the request carries only the conversation and the wanted JSON shape.
message CallRequest {
  repeated ChatMessage messages = 1;
  // Optional JSON Schema of the answer. Empty: any JSON object or array.
  string json_schema = 2;
}

// One message of the stream: zero or more progress updates, then exactly one result.
message CallResponse {
  oneof event {
    CallProgress progress = 1;
    CallResult result = 2;
  }
}

message CallProgress {
  // started | thinking | writing
  string stage = 1;
  // Everything the model has written so far (not only the newest piece).
  string partial_text = 2;
  uint32 elapsed_ms = 3;
}

message CallResult {
  // The answer as a JSON document (object or array), already validated as JSON.
  string json = 1;
  // The raw text the model returned.
  string text = 2;
  CallMetadata metadata = 3;
}

message CallMetadata {
  string caller_id = 1;
  string driver = 2;
  string model = 3;
  uint64 duration_ms = 4;
  uint64 input_tokens = 5;
  uint64 output_tokens = 6;
}

service LlmCallerService {
  // Streams progress while the model writes, then the final result.
  rpc Call(CallRequest) returns (stream CallResponse) {}
}
