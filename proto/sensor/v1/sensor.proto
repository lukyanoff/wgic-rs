syntax = "proto3";

package sensor.v1;

// Mirrors the hand-written prost structs in crates/contracts/src/lib.rs (the Rust source of truth).
// Used only for the web playground's descriptors. Keep both in sync.

// Takes a picture with this instance's sensor (screen, camera or fake), chosen by --config.
service SensorService {
  rpc Capture(CaptureRequest) returns (CaptureResponse) {}
}

message CaptureRequest {}

message CaptureResponse {
  bytes data = 1;
  string mime_type = 2;
}
