syntax = "proto3";

package visioner.v1;

// Mirrors the hand-written prost structs in crates/contracts/src/lib.rs (the Rust source of truth).
// Used only for the web playground's descriptors. Keep both in sync.

// Captures from a sensor instance and asks an LLM caller instance about the image.
// Unset fields fall back to the instance's --config.
service VisionerService {
  rpc Capture(CaptureRequest) returns (CaptureResponse) {}
}

message CaptureRequest {
  optional string sensor = 1;
  optional string llm_caller = 2;
  optional string system_prompt = 3;
  optional string text_prompt = 4;
  optional string user_prompt = 5;
}

message CaptureResponse {
  string text = 1;
  string model = 2;
  string sensor_mime_type = 3;
}
