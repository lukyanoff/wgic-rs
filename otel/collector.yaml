# OpenTelemetry Collector for local development.
# Mounted by compose.yaml at /etc/otelcol-contrib/config.yaml.
#
#   Rust servers/clients ─┐
#   browser playground ───┼─ OTLP (4317 gRPC, 4318 HTTP) ─▶ traces  ─▶ Jaeger
#                         │                                 logs    ─▶ Loki ◀─ Grafana
#                         │                                 metrics ─▶ :8889 ◀─ Prometheus ◀─ Grafana

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
        # The playground exports straight from the browser.
        cors:
          allowed_origins: ["http://localhost:5173", "http://127.0.0.1:5173", "http://localhost:5174", "http://127.0.0.1:5174"]
          allowed_headers: ["*"]
          max_age: 7200

processors:
  batch:
    timeout: 500ms
  # Service logs (`sdk::OtelLogger`) carry their fields as one JSON string in `log_fields`; turn them into real
  # log attributes. The Rust OTLP bridge leaves the event time empty, so use the time the record was observed.
  transform/service_fields:
    error_mode: ignore
    log_statements:
      - context: log
        statements:
          - merge_maps(attributes, ParseJSON(attributes["log_fields"]), "upsert") where attributes["log_fields"] != nil
          - delete_key(attributes, "log_fields")
          - set(time, observed_time) where time_unix_nano == 0

exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  # Log records (with trace_id/span_id and their attributes as structured metadata). Query in Grafana → Explore.
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
  # Scraped by Prometheus (prometheus/prometheus.yml). `service.name` etc. become labels.
  prometheus:
    endpoint: 0.0.0.0:8889
    resource_to_telemetry_conversion:
      enabled: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/jaeger]
    logs:
      receivers: [otlp]
      processors: [transform/service_fields, batch]
      exporters: [otlphttp/loki]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
