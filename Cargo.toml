# Cognitive Boxes workspace. Dependency arrows point DOWN only (see CLAUDE.md):
#   apps/*  ->  services/*  ->  kernel, contracts
#   apps/*  ->  platform    ->  kernel
[workspace]
resolver = "3"
members = [
    "crates/contracts",
    "crates/kernel",
    "crates/platform",
    "services/*",
    "apps/*",
    "tests/e2e",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
# boxes
contracts = { path = "crates/contracts" }
kernel = { path = "crates/kernel" }
platform = { path = "crates/platform" }
greet = { path = "services/greet" }
sensor = { path = "services/sensor" }
llm_caller = { path = "services/llm_caller" }
visioner = { path = "services/visioner" }

# third party
anyhow = "1.0.104"
async-nats = { version = "0.52.0", features = ["service"] }
axum = "0.8.9"
buffa = { version = "0.9.2", features = ["json"] }
buffa-types = { version = "0.9.2", features = ["json"] }
base64 = "0.22.1"
bytes = "1.12.1"
connectrpc = { version = "0.9.1", features = ["server", "client", "axum"] }
futures = "0.3.34"
http = "1.5.0"
http-body = "1.1.0"
http-body-util = "0.1.5"
nokhwa = { version = "0.10.11", default-features = false, features = ["decoding"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
opentelemetry = { version = "0.33", features = ["metrics"] }
opentelemetry-appender-tracing = "0.33"
opentelemetry-http = "0.33"
opentelemetry-otlp = { version = "0.33", features = ["metrics"] }
opentelemetry_sdk = { version = "0.33", features = ["rt-tokio", "metrics"] }
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "stream", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tokio = { version = "1.54.1", features = ["full"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["cors"] }
tracing = "0.1.44"
tracing-opentelemetry = "0.34"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json", "registry"] }
uuid = { version = "1.29.2", features = ["v4"] }
v4l = "0.14.0"
xcap = "0.9.10"

# Readability limits, enforced by `cargo clippy` (thresholds in clippy.toml).
[workspace.lints.clippy]
# `cognitive_complexity` is off on purpose: it counts expanded `tracing` macros, so a
# 7-line function with two log calls fails. Length + nesting limits measure what we care about.
too_many_lines = "warn"
too_many_arguments = "warn"
type_complexity = "warn"
excessive_nesting = "warn"
fn_params_excessive_bools = "warn"
struct_excessive_bools = "warn"

# Smaller debug builds: backtraces keep file:line for our code, no debug info for third-party crates.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# `run-all.sh --prod`: optimized, smaller binary (less code mapped into each process).
[profile.release]
lto = "thin"
strip = "symbols"
