[package]
name = "connect-rust-example"
version = "0.1.0"
edition = "2024"

[dependencies]
async-nats = { version = "0.52.0", features = ["service"] }
axum = "0.8.9"
buffa = { version = "0.9.2", features = ["json"] }
buffa-types = { version = "0.9.2", features = ["json"] }
bytes = "1.12.1"
connectrpc = { version = "0.9.1", features = ["server", "client", "axum"] }
futures = "0.3.34"
http = "1.5.0"
http-body = "1.1.0"
http-body-util = "0.1.5"
opentelemetry = "0.33"
opentelemetry-appender-tracing = "0.33"
opentelemetry-http = "0.33"
opentelemetry-otlp = "0.33"
opentelemetry_sdk = { version = "0.33", features = ["rt-tokio"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tokio = { version = "1.54.1", features = ["full"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["cors"] }
tracing = "0.1.44"
tracing-opentelemetry = "0.34"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json", "registry"] }
uuid = { version = "1.29.2", features = ["v4"] }
