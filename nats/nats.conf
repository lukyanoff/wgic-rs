# NATS server config for local development.
# Mounted by compose.yaml at /etc/nats/nats.conf.

server_name: dev-nats

# Client connections (Rust servers and clients, nats CLI).
port: 4222

# Monitoring: http://localhost:8222 (/varz, /connz, /healthz).
http_port: 8222

# Largest message (default 1MB). sensor replies carry a whole screenshot:
# a 4K JPEG is ~0.8MB, ~1.1MB as base64 JSON; a 4K PNG ~1.2MB raw.
max_payload: 8MB

# WebSocket, used by the browser playground (ws://localhost:9222).
websocket {
  port: 9222
  # Plain ws:// is fine for localhost only. Use TLS (wss://) in production:
  #   tls { cert_file: "/certs/server.pem", key_file: "/certs/server-key.pem" }
  no_tls: true
  # Origins allowed to open a WebSocket. Keep in sync with the playground URL.
  # 5174 is where Vite goes when 5173 is already taken.
  allowed_origins: [
    "http://localhost:5173", "http://127.0.0.1:5173",
    "http://localhost:5174", "http://127.0.0.1:5174"
  ]
  compression: true
}

# Dev only: no auth. Add accounts/users (or nkeys/JWT) before exposing this.
