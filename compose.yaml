services:
  nats:
    image: docker.io/library/nats:2.11-alpine
    command: ["-c", "/etc/nats/nats.conf"]
    volumes:
      - ./nats/nats.conf:/etc/nats/nats.conf:ro
    ports:
      - "4222:4222" # clients
      - "9222:9222" # websocket (browser playground)
      - "8222:8222" # monitoring
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5

  # NATS CLI, run on demand: scripts/nats.sh micro ls
  nats-box:
    image: docker.io/natsio/nats-box:latest
    profiles: ["tools"]
    environment:
      NATS_URL: nats://nats:4222

  # OTLP entry point for every process (Rust + browser): 4317 gRPC, 4318 HTTP.
  otel-collector:
    image: docker.io/otel/opentelemetry-collector-contrib:0.128.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./otel/collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889" # Prometheus metrics endpoint (scraped by prometheus)
    depends_on:
      - jaeger

  # Trace storage + UI/API: http://localhost:16686 (OTLP from the collector only).
  jaeger:
    image: docker.io/jaegertracing/jaeger:2.7.0
    ports:
      - "16686:16686"

  # Metrics storage + UI/API: http://localhost:9090 (scrapes the collector's :8889).
  prometheus:
    image: docker.io/prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - otel-collector

  # Dashboards: http://localhost:3000 (no login in local dev). Datasources and the
  # "RPC overview" dashboard are provisioned from ./grafana.
  grafana:
    image: docker.io/grafana/grafana:12.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - jaeger
