services:
  nats:
    image: docker.io/library/nats:2.11-alpine
    command: ["-c", "/etc/nats/nats.conf"]
    volumes:
      - ./nats/nats.conf:/etc/nats/nats.conf:ro
    ports:
      - "4222:4222" # clients
      - "9222:9222" # websocket (browser playground)
      - "8222:8222" # monitoring
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5

  # NATS CLI, run on demand: podman compose run --rm nats-box nats micro ls
  nats-box:
    image: docker.io/natsio/nats-box:latest
    profiles: ["tools"]
    environment:
      NATS_URL: nats://nats:4222
