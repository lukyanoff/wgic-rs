[package]
name = "visioner"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = "1"
async-trait = "0.1"
contracts = { path = "../../crates/contracts" }
sdk = { path = "../../crates/sdk" }
serde = { version = "1", features = ["derive"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
