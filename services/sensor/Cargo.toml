[package]
name = "sensor"
description = "Box 3: takes a picture of a screen or from a camera."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
contracts.workspace = true
kernel.workspace = true
connectrpc.workspace = true
image.workspace = true # PNG / JPEG encoding
tokio.workspace = true # spawn_blocking: capturing is blocking OS IO
xcap.workspace = true  # screens: Windows, macOS, Linux (X11 + Wayland)

# Cameras: one nokhwa backend per OS (≈ `#if LINUX` / `#if OSX` / `#if WINDOWS` package references in a .csproj).
[target.'cfg(target_os = "linux")'.dependencies]
nokhwa = { workspace = true, features = ["input-v4l"] }
v4l.workspace = true # only to skip /dev/video* nodes that can't deliver pictures

[target.'cfg(target_os = "macos")'.dependencies]
nokhwa = { workspace = true, features = ["input-avfoundation"] }

[target.'cfg(target_os = "windows")'.dependencies]
nokhwa = { workspace = true, features = ["input-msmf"] }

[lints]
workspace = true
