[package]
name = "llm_caller"
description = "Box 3: calls an LLM (claude/agy CLI, OpenAI, OpenRouter) and streams progress + a JSON answer."
version.workspace = true
edition.workspace = true
publish.workspace = true

# Services depend ONLY on contracts + kernel + libs/* (+ plain libraries). Never on platform,
# another service, tracing/opentelemetry (use the injected Logger/Metrics) or anyhow.
[dependencies]
contracts.workspace = true
kernel.workspace = true
connectrpc.workspace = true
base64.workspace = true     # images as data URLs / base64 blocks
futures.workspace = true
reqwest.workspace = true    # HTTP drivers (OpenAI, OpenRouter)
serde_json.workspace = true # CLI stream-json lines, SSE events, the JSON answer
tokio.workspace = true      # child processes (CLI drivers), channels, timeouts

[lints]
workspace = true
