[package]
name = "camera_sensor"
description = "Box 3: takes a picture from a webcam (cross-platform, pluggable capture drivers)."
version.workspace = true
edition.workspace = true
publish.workspace = true

# Services depend ONLY on contracts + kernel + libs/* (+ plain libraries). Never on platform,
# another service, tracing/opentelemetry (use the injected Logger/Metrics) or anyhow.
[dependencies]
contracts.workspace = true
kernel.workspace = true
sensor_base.workspace = true
connectrpc.workspace = true

# nokhwa backends per OS (≈ `#if LINUX` / `#if OSX` / `#if WINDOWS` package references in a .csproj).
[target.'cfg(target_os = "linux")'.dependencies]
nokhwa = { workspace = true, features = ["input-v4l"] }
v4l.workspace = true # only to skip non-capture /dev/video* nodes (UVC metadata nodes)

[target.'cfg(target_os = "macos")'.dependencies]
nokhwa = { workspace = true, features = ["input-avfoundation"] }

[target.'cfg(target_os = "windows")'.dependencies]
nokhwa = { workspace = true, features = ["input-msmf"] }

[dev-dependencies]
tokio.workspace = true

[lints]
workspace = true
