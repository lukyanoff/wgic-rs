version: v2
plugins:
  - remote: buf.build/anthropics/buffa
    out: crates/contracts/src/gen/buffa
    opt:
      - file_per_package=true
      - json=true
  - remote: buf.build/connectrpc/rust
    out: crates/contracts/src/gen/connect
    opt:
      - file_per_package
      - buffa_module=crate::proto