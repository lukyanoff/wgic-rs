[package]
name = "sdk"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = "1"
async-nats = "0.39"
async-trait = "0.1"
bytes = "1"
contracts = { path = "../contracts" }
futures = "0.3"
prost = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry", "fmt"] }
