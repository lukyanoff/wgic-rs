[package]
name = "sdk"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = "1"
async-nats = { version = "0.39", features = ["service"] }
async-trait = "0.1"
bytes = "1"
contracts = { path = "../contracts" }
futures = "0.3"
opentelemetry = { version = "0.33", features = ["metrics"] }
opentelemetry-appender-tracing = "0.33"
opentelemetry-otlp = { version = "0.33", features = ["metrics"] }
opentelemetry_sdk = { version = "0.33", features = ["rt-tokio", "metrics"] }
prost = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-opentelemetry = "0.34"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry", "fmt"] }
uuid = { version = "1", features = ["v4"] }
